<!--3.Structure a webpage using semantic HTML5 tags-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<body>
    <header>
        <h1>My Webpage</h1>
        <nav>
            <ul>
                <li><a href="#student">Student</a></li>
                <li><a href="#name">Name</a></li>
                <li><a href="#rollno.">Roll Number</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="student"> 
            <h2>Student Information</h2>
            
            <p>This is the student section.</p>
        </section>

        <section id="name">
            <h2>Name</h2>
            <p>This is the name section.</p>
        </section>

        <section id="rollno.">
            <h2>Roll Number</h2>
            <p>This is the roll number section.</p>
        </section>
    </main>
        <p> My Webpage. All rights reserved.</p>
</body>
</head>
</html>
