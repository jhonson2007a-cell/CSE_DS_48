<!-- using table for different multimedia -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Example</title>
</head>
<body>
    <table border="1">
        <tr>
            <td>
                <strong>Audio</strong><br>
                <audio controls src=""></audio>
            </td>
            <td>
                <strong>Image</strong><br>
                <img src="bicycle.jpg" controls width="320" alt="Bicycle image">
            </td>
            <td>
                <strong>Video</strong><br>
                <video src="vi.mp4" controls width="420" ></video>
            </td>
            <td>
                <strong>Website</strong><br>
                <iframe src="https://github.com/jhonson2007a-cell" title="GitHub profile" width="300" height="200"></iframe>
            </td>
        </tr>
    </table>
</body>
</html>
